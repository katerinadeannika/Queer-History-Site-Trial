name: Publish complete deduplicated bibliography
on:
  push:
    branches: [editorial-source]
    paths: ['.github/workflows/publish-complete-bibliography.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp bibliography.preview.html /tmp/bibliography.html
          git fetch origin main
          git checkout main
          cp /tmp/bibliography.html bibliography.html
          git add bibliography.html
          git diff --cached --quiet || git commit -m "Publish complete deduplicated bibliography"
          git push origin main