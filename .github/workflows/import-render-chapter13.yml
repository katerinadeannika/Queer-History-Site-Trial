name: Import and render Chapter 13 further reading
on:
  push:
    branches: [editorial-source]
    paths: ['.github/workflows/import-render-chapter13.yml']
permissions:
  contents: write
jobs:
  import-render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install markdown
      - run: |
          curl -fsSL https://raw.githubusercontent.com/katerinadeannika/queer-history/main/13_Further_Reading_updated_US_spelling.md -o chapter-13-further-reading.md
          test "$(git hash-object chapter-13-further-reading.md)" = "473af323f203bcc1f5ac6b310557ea4fa0d075e1"
      - run: |
          python - <<'PY'
          from pathlib import Path
          import markdown
          source = Path('chapter-13-further-reading.md').read_text(encoding='utf-8').strip()
          section = '## Chapter 13 — Further Reading\n\n' + source + '\n'
          for name in ['Before_the_Name_complete_master.md', 'Before_the_Name_1880-1969.md']:
              path = Path(name); text = path.read_text(encoding='utf-8')
              if '## Chapter 13 — Further Reading' not in text:
                  path.write_text(text.rstrip() + '\n\n---\n\n' + section, encoding='utf-8')
          body = markdown.markdown(section, extensions=['extra','sane_lists','tables'])
          out = f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 13 — Further Reading | Early Queer History</title><link rel="stylesheet" href="site.css"></head><body><header class="site-header"><a href="index.html">Home</a><a href="chapters.html">Chapters</a><a href="research.html">Research</a><a href="bibliography.html">Bibliography</a></header><main class="page chapter">{body}<nav class="chapter-nav"><a href="chapter-12-end-material.html">← Previous chapter</a></nav></main><footer class="site-footer">Early Queer History · Chapter 13</footer></body></html>'''
          Path('chapter-13-further-reading.preview.html').write_text(out, encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter-13-further-reading.md chapter-13-further-reading.preview.html Before_the_Name_complete_master.md Before_the_Name_1880-1969.md
          git diff --cached --quiet || git commit -m "Import and render Chapter 13 further reading"
          git push