name: Build complete editorial master
on:
  push:
    branches: [editorial-source]
    paths:
      - 'Before_the_Name_1880-1969.md'
      - 'Before_the_Name_combined_addendum.md'
      - 'Before_the_Name_master_integration_map.md'
      - 'tools/build_complete_master.py'
      - '.github/workflows/build-complete-master.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/build_complete_master.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Before_the_Name_complete_master.md
          git diff --cached --quiet || git commit -m "Generate complete editorial master"
          git push