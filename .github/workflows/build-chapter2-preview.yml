name: Build Chapter 2 editorial preview
on:
  push:
    branches: [editorial-source]
    paths:
      - 'Before_the_Name_1880-1969.md'
      - 'Before_the_Name_complete_master.md'
      - 'tools/build_chapter2_preview.py'
      - '.github/workflows/build-chapter2-preview.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/build_chapter2_preview.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter-02-1880s.preview.html
          git diff --cached --quiet || git commit -m "Generate Chapter 2 editorial preview"
          git push